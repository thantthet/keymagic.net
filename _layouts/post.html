---
layout: default
---
<article class="container" style="padding-top: 120px; padding-bottom: 6rem; max-width: 800px;">
  <div class="post-header" style="margin-bottom: 3rem;">
    <div style="color: var(--accent-color); font-weight: 600; font-size: 0.9rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.1em;">
      {{ page.date | date: "%B %d, %Y" }}
    </div>
    <h1 style="font-size: 3.5rem; line-height: 1.1;">{{ page.title }}</h1>
  </header>

  <div class="post-content" style="color: var(--text-secondary); line-height: 1.8; font-size: 1.15rem;">
    {{ content }}
  </div>

  <div style="margin-top: 6rem; padding-top: 2rem; border-top: 1px solid var(--surface-border);">
    <a href="/" style="color: var(--accent-color); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 600;">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>
  </div>
</article>

<style>
  .post-content p { margin-bottom: 2rem; }
  .post-content h2 { color: var(--text-primary); margin-top: 4rem; margin-bottom: 1.5rem; }
  .post-content img { max-width: 100%; border-radius: 12px; margin: 2rem 0; border: 1px solid var(--surface-border); }
  .post-content a { color: var(--accent-color); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.2s; }
  .post-content a:hover { border-color: var(--accent-color); }
</style>
